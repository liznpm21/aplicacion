<ion-app>

  <ion-menu contentId="main-content" side="start">

    <ion-header>
      <ion-toolbar color="dark">
        <ion-title>Barbershop</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-menu-toggle autoHide="true">
          <ion-item routerLink="/home">
            <ion-label>Inicio</ion-label>
          </ion-item>
          <ion-item routerLink="/services">
            <ion-label>Servicios</ion-label>
          </ion-item>
          <ion-item routerLink="/booking">
            <ion-label>Reservas</ion-label>
          </ion-item>
          <ion-item *ngIf="isAdmin" routerLink="/admin">
            <ion-label>Administrador</ion-label>
          </ion-item>
          <ion-item *ngIf="isLoggedIn" button (click)="logout()">
            <ion-label>Cerrar sesión</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>

  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
