<ion-content class="register-page">

  <div class="register-container">

    <div class="logo-container">
      <h1>BARBERSHOP</h1>
      <p>Crear cuenta</p>
    </div>

    <ion-item>
      <ion-icon name="person-outline" slot="start"></ion-icon>

      <ion-input
        [(ngModel)]="name"
        name="name"
        type="text"
        placeholder="Nombre completo">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-icon name="mail-outline" slot="start"></ion-icon>

      <ion-input
        [(ngModel)]="email"
        name="email"
        type="email"
        placeholder="Correo electrónico">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>

      <ion-input
        [(ngModel)]="password"
        name="password"
        type="password"
        placeholder="Contraseña">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>

      <ion-input
        [(ngModel)]="confirmPassword"
        name="confirmPassword"
        type="password"
        placeholder="Confirmar contraseña">
      </ion-input>
    </ion-item>

    <ion-button
      expand="block"
      class="register-button"
      (click)="register()">

      CREAR CUENTA

    </ion-button>

    <p class="login-text">
      ¿Ya tienes una cuenta?
    </p>

    <ion-button
      expand="block"
      fill="clear"
      class="login-button"
      routerLink="/home">

      INICIAR SESIÓN

    </ion-button>

  </div>

</ion-content>
